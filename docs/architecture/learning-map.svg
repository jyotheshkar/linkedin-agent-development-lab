<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title description">
<title id="title">Learning map: one component at a time</title><desc id="description">The complete product is available; optional experiments do not gate application startup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f7b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="650" fill="#183333">Learning map: one component at a time</text>
<text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607575">The complete product is available; optional experiments do not gate application startup.</text>
<rect x="48" y="145" width="480" height="130" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="66" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Locate the boundary</text>
<text x="66" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">01 / VISUAL</text>
<text x="66" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">System/sequence diagram + lesson ID</text>
<rect x="592" y="145" width="480" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="610" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Read exact symbols</text>
<text x="610" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">02 / SOURCE</text>
<text x="610" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Current branch/commit + linked tests</text>
<rect x="48" y="335" width="480" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Trace one input</text>
<text x="66" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">03 / EXECUTION</text>
<text x="66" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Accepted path + one rejected boundary</text>
<rect x="592" y="335" width="480" height="130" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="610" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Change one isolated thing</text>
<text x="610" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">04 / EXPERIMENT</text>
<text x="610" y="407" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Copied fixture or temporary test; safe reset</text>
<rect x="48" y="525" width="480" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Run the targeted check</text>
<text x="66" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">05 / VERIFY</text>
<text x="66" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Record actual result and limitation</text>
<rect x="592" y="525" width="480" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="610" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Discuss mechanism and trade-off</text>
<text x="610" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">06 / EXPLAIN</text>
<text x="610" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">L1 implementation / L2 design preparation</text>
<polyline points="528,210 592,210" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="832,275 832,310 288,310 288,335" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="528,400 592,400" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="832,465 832,500 288,500 288,525" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="528,590 592,590" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="48" y="758" width="1024" height="62" rx="9" fill="#eef8f5" stroke="#cbded9" stroke-width="1.4"/>
<text x="65" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#087f7b">Learning evidence is separate from system evaluation and recruitment outcome.</text>
<text x="65" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">No graded attempts = N/A. Reference exposure is allowed; independent mastery needs fresh observed transfer.</text>
</svg>
