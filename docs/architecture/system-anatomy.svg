<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title description">
<title id="title">System anatomy</title><desc id="description">Development tools contain the runtime; future hosting is a separate, unexecuted delivery choice.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f7b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="650" fill="#183333">System anatomy</text>
<text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607575">Development tools contain the runtime; future hosting is a separate, unexecuted delivery choice.</text>
<text x="48" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#087f7b">DEVELOPMENT AND SOURCE</text>
<rect x="48" y="145" width="310" height="106" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">GitHub repository</text>
<text x="66" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Private source + history</text>
<text x="66" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Tests, lock, lessons, diagrams</text>
<rect x="405" y="145" width="310" height="106" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="423" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">GitHub Codespace</text>
<text x="423" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Python 3.12 development</text>
<text x="423" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Terminal + private preview</text>
<rect x="762" y="145" width="310" height="106" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="780" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Future hosting</text>
<text x="780" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Prepared configuration only</text>
<text x="780" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">No deployment by this build</text>
<polyline points="358,198 405,198" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="48" y="295" width="1024" height="472" rx="12" fill="#f8fcfa" stroke="#cbded9" stroke-width="1.4"/>
<text x="70" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#087f7b">PYTHON APPLICATION RUNTIME</text>
<rect x="70" y="350" width="270" height="112" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="88" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">CLI / FastAPI / console</text>
<text x="88" y="403" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">cli.py, web_api.py</text>
<text x="88" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Thin interfaces; same services</text>
<rect x="405" y="350" width="310" height="112" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="423" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">ApplicationService</text>
<text x="423" y="403" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">application.py</text>
<text x="423" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Input, artifacts, review, report</text>
<rect x="780" y="350" width="270" height="112" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="798" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Workflow / LangGraph</text>
<text x="798" y="403" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">workflow.py + agent.py</text>
<text x="798" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">State, policy, bounded tools</text>
<polyline points="340,406 405,406" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="715,406 780,406" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70" y="565" width="270" height="126" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="88" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">RAGService</text>
<text x="88" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">service.py, knowledge.py</text>
<text x="88" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">retrieval.py, grounding.py</text>
<text x="88" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Query + retained context</text>
<rect x="405" y="565" width="310" height="126" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="423" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Atlas Lab</text>
<text x="423" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">atlas_lab.py</text>
<text x="423" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Versions, artifacts, events</text>
<text x="423" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Derived reporting projection</text>
<rect x="780" y="565" width="270" height="126" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="798" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Simulated provider</text>
<text x="798" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">provider.py</text>
<text x="798" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Independent payload-bound</text>
<text x="798" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">sim: receipts; no employer I/O</text>
<polyline points="405,420 373,420 373,625 340,625" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="560,462 560,565" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="915,462 915,565" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="70" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Local MVP: SQLite/journal. Legacy Postgres workflow is separate; Atlas artifact parity is not assumed.</text>
<rect x="48" y="800" width="1024" height="62" rx="9" fill="#eef8f5" stroke="#cbded9" stroke-width="1.4"/>
<text x="65" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#087f7b">Tests/configuration support the runtime; learner scoring is a separate learning path.</text>
<text x="65" y="847" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Imported private snapshots stay untracked. Indexes and projections derive from eligible source evidence.</text>
</svg>
