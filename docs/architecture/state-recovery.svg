<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title description">
<title id="title">State and recovery</title><desc id="description">Persist intent before effects; preserve reviewed payloads during retries and reconciliation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f7b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="650" fill="#183333">State and recovery</text>
<text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607575">Persist intent before effects; preserve reviewed payloads during retries and reconciliation.</text>
<rect x="48" y="142" width="300" height="108" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Prepared drafts</text>
<text x="66" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Evidence + artifacts + action plan</text>
<text x="66" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Await exact owner review</text>
<rect x="410" y="142" width="300" height="108" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="428" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Reviewed material</text>
<text x="428" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Approve exact binding OR reject</text>
<text x="428" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">No model-supplied approval</text>
<rect x="772" y="142" width="300" height="108" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="790" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Running</text>
<text x="790" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Persist intent, then provider call</text>
<text x="790" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Validate output before acceptance</text>
<polyline points="348,196 410,196" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="710,196 772,196" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="48" y="360" width="300" height="134" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Known pre-effect failure</text>
<text x="66" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Declared transient -&gt; bounded retry</text>
<text x="66" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Permanent/validation -&gt; blocked</text>
<text x="66" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Budget stays finite</text>
<rect x="410" y="360" width="300" height="134" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="428" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Unknown outcome / pending</text>
<text x="428" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Effect may already exist</text>
<text x="428" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Reserve work; do not repeat</text>
<text x="428" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Journal failure follows same path</text>
<rect x="772" y="360" width="300" height="134" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="790" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Verified provider receipt</text>
<text x="790" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Gate + action identity + payload</text>
<text x="790" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Same receipt survives restart</text>
<text x="790" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">No duplicate employer simulation</text>
<polyline points="922,250 922,300 198,300 198,360" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="922,250 922,320 560,320 560,360" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="48,420 26,420 26,280 950,280 950,250" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="62" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#087f7b">declared transient + budget: retry</text>
<polyline points="710,427 772,427" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="716" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#087f7b">reconcile</text>
<rect x="48" y="609" width="300" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="66" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Blocked / rejected</text>
<text x="66" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">No automatic effect repetition</text>
<text x="66" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Fix cause and obtain fresh review</text>
<text x="66" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Preserve known receipt evidence</text>
<rect x="410" y="609" width="300" height="130" rx="12" fill="#eef8f5" stroke="#087f7b" stroke-width="1.4"/>
<text x="428" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087f7b">Ledger / projection pending</text>
<text x="428" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Repair event logging or projection</text>
<text x="428" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Do not repeat application/outreach</text>
<text x="428" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Verify revision and membership</text>
<rect x="772" y="609" width="300" height="130" rx="12" fill="#ffffff" stroke="#cbded9" stroke-width="1.4"/>
<text x="790" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#183333">Plan finished</text>
<text x="790" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Inspect/draft may validly finish</text>
<text x="790" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Full unit needs all verified gates</text>
<text x="790" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">Pending delivery != full completion</text>
<polyline points="198,494 198,609" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="922,494 922,548 560,548 560,609" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="710,674 772,674" fill="none" stroke="#087f7b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="716" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#087f7b">verified</text>
<rect x="48" y="832" width="1024" height="62" rx="9" fill="#eef8f5" stroke="#cbded9" stroke-width="1.4"/>
<text x="65" y="857" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#087f7b">Restart reconstructs state from durable evidence, not an in-memory RAG cache.</text>
<text x="65" y="879" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#607575">A stable hash alone does not ensure exactly-once behavior; provider uniqueness and payload checks matter.</text>
</svg>
