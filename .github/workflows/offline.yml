name: Labelled offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked
      - run: uv run pytest -m infrastructure
  reference:
    if: github.ref == 'refs/heads/coach-reference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked
      - run: uv run pytest -m 'not semantic and not live'
