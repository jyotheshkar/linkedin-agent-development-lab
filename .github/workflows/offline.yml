name: Labelled offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --extra lab
      - run: uv run pytest -m infrastructure
      - run: uv build --wheel
      - name: Noneditable production package with no semantic extra
        run: |
          uv venv .lab/wheel-env
          uv pip install --python .lab/wheel-env/bin/python dist/*.whl
          .lab/wheel-env/bin/python -I scripts/check_installed.py
  reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://lab:synthetic-test-only@localhost:5432/lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --extra lab
      - run: uv run pytest -m 'not semantic and not live' --junitxml=.lab/deployment-reference.xml
      - run: uv run l1-lab validate-lessons
      - run: uv run l1-lab context-export --lesson CONTRACTS-01 --output .lab/ci-context.json
      - name: Build portable container without publication
        run: docker build -t linkedin-agent-lab:test .
